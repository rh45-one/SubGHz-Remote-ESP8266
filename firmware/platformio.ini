[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266 @ 4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    lsatan/SmartRC-CC1101-Driver-Lib @ 2.5.7
    sui77/rc-switch @ 2.6.4
    bblanchon/ArduinoJson @ 7.4.3

; Build-only fixture so the linker checks Wi-Fi/API code even without secrets.h.
; Never upload this environment: these are intentionally unusable placeholders.
[env:nodemcuv2-network-check]
extends = env:nodemcuv2
build_flags =
    -DWIFI_SSID=\"compile-test-only\"
    -DWIFI_PASSWORD=\"not-a-real-network\"
