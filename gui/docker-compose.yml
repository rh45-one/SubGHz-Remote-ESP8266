services:
  gui:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEVICE_MODE: ${DEVICE_MODE:-real}
      ESP_BASE_URL: ${ESP_BASE_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - signals:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  signals:
