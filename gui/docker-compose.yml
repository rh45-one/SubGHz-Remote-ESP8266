services:
  gui:
    image: ${GUI_IMAGE:-ghcr.io/rh45-one/subghz-remote-esp8266-gui}:${GUI_IMAGE_TAG:-latest}
    pull_policy: ${GUI_PULL_POLICY:-missing}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEVICE_MODE: ${DEVICE_MODE:-real}
      ESP_BASE_URL: ${ESP_BASE_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - signals:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "${WATCHTOWER_ENABLE:-true}"
      com.centurylinklabs.watchtower.scope: "${WATCHTOWER_SCOPE:-subghz-remote}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  signals:
